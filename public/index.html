<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Body Run</title>
<link rel="icon" href="data:,">
<style>
  :root { color-scheme: dark; --u: 2px; }
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; touch-action: none; -webkit-user-select: none; user-select: none; }
  body { font-family: system-ui, -apple-system, "Noto Sans KR", "Apple SD Gothic Neo", sans-serif; }
  #c { position: fixed; left: 0; top: 0; display: block; touch-action: none; }
  #wrap { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); transform-origin: 50% 50%; pointer-events: none; }
  #ov { position: absolute; inset: 0; pointer-events: none; }
  .txt { color: #fff; font-weight: 900; paint-order: stroke; -webkit-text-stroke: calc(var(--u) * 1.3) #1a0a14; letter-spacing: 0.02em; }
  #place { position: absolute; left: 0; right: 0; top: calc(var(--u) * 3); text-align: center; transition: transform 0.35s ease, top 0.35s ease; transform-origin: 50% 0; }
  #place.big { transform: scale(1.35); top: calc(var(--u) * 6); }
  #pname { font-size: calc(var(--u) * 11); line-height: 1.1; }
  #pen { font-size: calc(var(--u) * 5); color: #ffd696; -webkit-text-stroke: calc(var(--u) * 0.9) #1a0a14; }
  .panel { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: calc(var(--u) * 6); background: rgba(10, 4, 12, 0.72); pointer-events: auto; }
  .panel[hidden], #loading[hidden], #hudText[hidden] { display: none; }
  .panel h1 { margin: 0; font-size: calc(var(--u) * 12); }
  .panel p { margin: 0; color: #f4dce6; font-size: calc(var(--u) * 6); font-weight: 700; }
  .row { display: flex; gap: calc(var(--u) * 5); }
  .pb { pointer-events: auto; font: inherit; font-weight: 900; font-size: calc(var(--u) * 6.5); color: #fff; background: #e0506e; border: calc(var(--u) * 1) solid #1a0a14; border-radius: calc(var(--u) * 3); padding: calc(var(--u) * 3) calc(var(--u) * 8); box-shadow: 0 calc(var(--u) * 1.5) 0 #1a0a14; }
  .pb.alt { background: #4a3a58; }
  .setRow { display: flex; align-items: center; gap: calc(var(--u) * 4); }
  .setLab { font-size: calc(var(--u) * 6.5); width: calc(var(--u) * 40); text-align: right; }
  .pb.tg { background: #2f8a62; min-width: calc(var(--u) * 52); }
  .pb.tg.off { background: #2e2430; color: #a89aa4; }
  #select { background: radial-gradient(circle at 50% 30%, #3a1426, #10060c); }
  #grid { display: grid; grid-template-columns: repeat(5, auto); gap: calc(var(--u) * 3); }
  .card { pointer-events: auto; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; gap: calc(var(--u) * 1.5); width: calc(var(--u) * 62); height: calc(var(--u) * 48); background: #2a1626; border: calc(var(--u) * 1) solid #1a0a14; border-radius: calc(var(--u) * 3); color: #fff; font: inherit; font-size: calc(var(--u) * 5); font-weight: 800; padding: calc(var(--u) * 2); }
  .card canvas { width: auto; height: calc(var(--u) * 30); }
  .card.last { border-color: #ffd696; }
  #loading { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; color: #fff; font-weight: 800; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="wrap">
  <div id="ov">
    <div id="hudText" hidden>
      <div id="place" class="txt"><div id="pname"></div><div id="pen"></div></div>
    </div>
    <div id="select" class="panel" hidden>
      <h1 class="txt">캐릭터를 골라 주세요</h1>
      <div id="grid"></div>
    </div>
    <div id="pauseBox" class="panel" hidden>
      <h1 class="txt">일시정지</h1>
      <div class="row"><button id="bResume" class="pb">계속</button><button id="bRestart" class="pb alt">처음부터</button><button id="bChar" class="pb alt">캐릭터 바꾸기</button></div>
    </div>
    <div id="setBox" class="panel" hidden>
      <h1 class="txt">설정</h1>
      <div class="setRow"><span class="setLab txt">버튼 위치</span><button id="bSwap" class="pb alt"></button></div>
      <div class="setRow"><span class="setLab txt">사운드 끄기</span><button id="bSfx" class="pb tg"></button><button id="bMus" class="pb tg"></button></div>
      <div class="row"><button id="bSetBack" class="pb">닫기</button></div>
    </div>
    <div id="overBox" class="panel" hidden>
      <h1 class="txt">체력이 다 떨어졌어요</h1>
      <p id="overMsg"></p>
      <div class="row"><button id="bAgain" class="pb">다시</button><button id="bChar2" class="pb alt">캐릭터 바꾸기</button></div>
    </div>
  </div>
</div>
<div id="loading">불러오는 중</div>
<script>
// Body Run sounds: the effects and the ambience are synthesized with the Web Audio API; the mini-games' songs are
// files (made with the chip engine in chip/, see stages.js):
//  - effects: jump (1st/2nd/3rd), slide, items, heal, hit, game over, buttons, the rhythm and orbit stages' hits
//  - the running music: a file that loops (light, as if under water), turned down for the mini-games
//  - the songs of the rhythm and orbit stages: fetched early, decoded once the sound is on, played from the buffer
//    (a song can be started at any point of it, which the orbit stage uses to go back two beats after a miss)
// The voices take any audio context, so a test can render them offline and measure them.
window.BodySound = (() => {
  'use strict';
  let ctx = null, master = null, buses = null, noiseBuf = null, outNode = null;
  // the settings' sound switches: the effects, and the music (the running music and the mini-games' songs), each kept
  // in this browser (the old one switch for everything, if it was on, turns both off)
  const mute = { sfx: false, music: false }, mutes = {};
  try {
    const old = localStorage.getItem('bodyrun.mute') === '1';
    for (const k of ['sfx', 'music']) { const v = localStorage.getItem('bodyrun.mute.' + k); mute[k] = v === null ? old : v === '1'; }
  } catch (e) { /* storage off */ }

  // ---------------------------------------------------------------- building blocks
  function noise(c) {
    if (c === ctx && noiseBuf) return noiseBuf;
    const b = c.createBuffer(1, Math.floor(c.sampleRate * 1.0), c.sampleRate);
    const d = b.getChannelData(0);
    let s = 7;                                          // fixed seed: the same noise every time
    for (let i = 0; i < d.length; i++) { s = (s * 16807) % 2147483647; d[i] = (s / 2147483647) * 2 - 1; }
    if (c === ctx) noiseBuf = b;
    return b;
  }
  function gainEnv(c, out, t, peak, a, d, curve = 'exp') {
    const g = c.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(peak, t + a);
    if (curve === 'exp') g.gain.exponentialRampToValueAtTime(0.0001, t + a + d);
    else g.gain.linearRampToValueAtTime(0.0001, t + a + d);
    g.connect(out);
    return g;
  }
  function tone(c, out, t, type, f0, f1, dur, peak, a = 0.004, glide = null) {
    const o = c.createOscillator(); o.type = type;
    o.frequency.setValueAtTime(f0, t);
    if (f1 && f1 !== f0) o.frequency.exponentialRampToValueAtTime(f1, t + (glide || dur));
    const g = gainEnv(c, out, t, peak, a, dur);
    o.connect(g); o.start(t); o.stop(t + a + dur + 0.05);
    return o;
  }
  function burst(c, out, t, filter, f0, f1, q, dur, peak, a = 0.002) {
    const s = c.createBufferSource(); s.buffer = noise(c);
    const fl = c.createBiquadFilter(); fl.type = filter; fl.Q.value = q;
    fl.frequency.setValueAtTime(f0, t);
    if (f1 && f1 !== f0) fl.frequency.exponentialRampToValueAtTime(f1, t + dur);
    const g = gainEnv(c, out, t, peak, a, dur);
    s.connect(fl); fl.connect(g);
    s.start(t, Math.random() * 0.5); s.stop(t + a + dur + 0.05);
  }
  const NOTE = (n) => 440 * Math.pow(2, (n - 69) / 12);  // MIDI note number -> Hz
  // a wooden bat's crack (k: how hard): click, ring, thump
  function crack(c, out, t, k) {
    burst(c, out, t, 'highpass', 3600, 3600, 0.8, 0.012, 0.55 * k, 0.0005);
    burst(c, out, t, 'bandpass', 1850, 1700, 6, 0.05, 0.6 * k, 0.0008);
    tone(c, out, t, 'sine', 1080, 900, 0.04, 0.26 * k, 0.0008, 0.035);
    tone(c, out, t, 'sine', 2350, 2200, 0.025, 0.12 * k, 0.0008, 0.02);
    tone(c, out, t, 'sine', 170, 85, 0.08, 0.36 * k, 0.001, 0.07);
  }
  // under water: a lowpass the sound goes through (muffled), and a bubble (a sine whose pitch flies up as it forms)
  function water(c, out, f) { const lp = c.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = f; lp.Q.value = 0.7; lp.connect(out); return lp; }
  function bubble(c, out, t, f, peak) { tone(c, out, t, 'sine', f, f * 2.3, 0.055, peak, 0.003, 0.04); }
  function bloop(c, out, t, f, up, peak, bubbles) {
    const w = water(c, out, 1900);
    tone(c, w, t, 'sine', f, f * up, 0.17, peak, 0.004, 0.08);                 // the bloop
    tone(c, w, t, 'triangle', f * 2, f * 2 * up, 0.07, peak * 0.25, 0.004, 0.06);   // its edge
    for (const [dt, bf] of bubbles) bubble(c, out, t + dt, bf, peak * 0.2);
  }

  // ---------------------------------------------------------------- effects
  const SFX = {
    // jumping and sliding, as if under water: a jump is a 'bloop' (a bubble's note flying up, muffled) with little
    // bubbles after it, higher for the second and third; a slide is a swoosh of water going down, a soft thump, bubbles
    jump1: (c, o, t) => bloop(c, o, t, 210, 2.4, 0.28, [[0.05, 720], [0.1, 980]]),
    jump2: (c, o, t) => bloop(c, o, t, 290, 2.3, 0.25, [[0.045, 880], [0.085, 1180], [0.13, 1020]]),
    jump3: (c, o, t) => bloop(c, o, t, 380, 2.2, 0.23, [[0.04, 1040], [0.075, 1400], [0.11, 1240], [0.15, 1640]]),
    slide: (c, o, t) => {
      const w = water(c, o, 1500);
      burst(c, w, t, 'lowpass', 1300, 240, 0.9, 0.3, 0.3, 0.025);
      tone(c, w, t, 'sine', 150, 85, 0.16, 0.14, 0.006, 0.14);
      for (const [dt, f, pk] of [[0.06, 560, 0.06], [0.12, 700, 0.05], [0.19, 640, 0.04]]) bubble(c, o, t + dt, f, pk);
    },
    coin: (c, o, t) => { tone(c, o, t, 'triangle', NOTE(88), null, 0.06, 0.2); tone(c, o, t + 0.055, 'triangle', NOTE(93), null, 0.14, 0.2); },
    special: (c, o, t) => { [84, 88, 91, 96].forEach((n, i) => tone(c, o, t + i * 0.045, 'triangle', NOTE(n), null, 0.12, 0.17)); },
    atp: (c, o, t) => {
      [81, 85, 88, 93, 97].forEach((n, i) => tone(c, o, t + i * 0.04, 'triangle', NOTE(n), null, 0.12, 0.15));
      tone(c, o, t + 0.2, 'sine', NOTE(100), NOTE(100), 0.35, 0.08, 0.01);
    },
    heal: (c, o, t) => { tone(c, o, t, 'sine', 523, 784, 0.32, 0.24, 0.01, 0.22); tone(c, o, t + 0.12, 'sine', 1046, 1568, 0.26, 0.08, 0.01, 0.2); },
    hit: (c, o, t) => {
      tone(c, o, t, 'sine', 170, 45, 0.24, 0.62, 0.003, 0.2);
      burst(c, o, t, 'lowpass', 1100, 300, 0.7, 0.14, 0.32);
      tone(c, o, t, 'square', 320, 150, 0.1, 0.06, 0.003, 0.1);
    },
    over: (c, o, t) => { [67, 64, 60, 55].forEach((n, i) => tone(c, o, t + i * 0.2, 'triangle', NOTE(n), null, 0.3, 0.22, 0.01)); },
    ui: (c, o, t) => tone(c, o, t, 'triangle', 880, null, 0.05, 0.14),
    // the rhythm stage
    perfect: (c, o, t) => { burst(c, o, t, 'bandpass', 2600, 2600, 1.1, 0.08, 0.42); tone(c, o, t, 'sine', 1320, 1320, 0.06, 0.16); },
    good: (c, o, t) => { burst(c, o, t, 'bandpass', 1500, 1500, 1.0, 0.08, 0.32); tone(c, o, t, 'sine', 880, 880, 0.05, 0.1); },
    miss: (c, o, t) => { tone(c, o, t, 'sine', 120, 70, 0.16, 0.3, 0.004, 0.14); burst(c, o, t, 'lowpass', 420, 300, 0.7, 0.1, 0.18); },
    tick: (c, o, t) => tone(c, o, t, 'triangle', 1600, null, 0.03, 0.09),
    spinDone: (c, o, t) => { [76, 79, 83, 88].forEach((n) => tone(c, o, t, 'triangle', NOTE(n), null, 0.5, 0.09, 0.01)); },
    // the orbit stage: landing on a tile, the end (a miss sounds like the rhythm stage's)
    orbHit: (c, o, t) => { burst(c, o, t, 'bandpass', 3400, 3400, 1.6, 0.045, 0.34); tone(c, o, t, 'sine', 1760, 1760, 0.035, 0.1); },
    orbClear: (c, o, t) => { [72, 76, 79, 84, 88].forEach((n, i) => tone(c, o, t + i * 0.06, 'triangle', NOTE(n), null, 0.4, 0.13, 0.006)); },
    // baseball: the throw (a whoosh), the swing (a quicker one), the ball into the mitt (a leathery pop), bat on ball (a
    // wooden knock), a home run (a crack, a deep thump, a little fanfare and the crowd's roar rising), out (three going down)
    bbPitch: (c, o, t) => burst(c, o, t, 'bandpass', 520, 1500, 1.3, 0.3, 0.5, 0.03),
    bbSwing: (c, o, t) => { burst(c, o, t, 'bandpass', 600, 2300, 1.5, 0.17, 0.55, 0.012); tone(c, o, t, 'sine', 240, 140, 0.12, 0.05, 0.01, 0.12); },
    bbMitt: (c, o, t) => { burst(c, o, t, 'lowpass', 1100, 320, 0.8, 0.07, 0.42, 0.001); tone(c, o, t, 'sine', 160, 90, 0.09, 0.3, 0.002, 0.08); },
    // bat on ball: a wooden crack - a sharp click, the wood ringing (a couple of resonances), a low thump
    bbHit: (c, o, t) => { crack(c, o, t, 0.8); burst(c, o, t + 0.12, 'bandpass', 700, 900, 0.7, 0.55, 0.05, 0.18); },   // a foul: the crowd's "ooh"
    bbHR: (c, o, t) => {
      crack(c, o, t, 1);
      const w = water(c, o, 2600); crack(c, w, t + 0.13, 0.22);                                        // its echo round the ballpark
      [72, 76, 79, 84, 88].forEach((n, i) => tone(c, o, t + 0.28 + i * 0.075, 'triangle', NOTE(n), null, i === 4 ? 0.7 : 0.3, 0.12, 0.006));
      burst(c, o, t + 0.08, 'bandpass', 800, 1400, 0.6, 1.8, 0.16, 0.35);                               // the crowd's roar, rising
      burst(c, o, t + 0.1, 'bandpass', 2200, 2600, 0.8, 1.5, 0.05, 0.4);
    },
    // into the toilet (the end of the body): a deep plunk, the water thrown up, then bubbles under the surface
    splash: (c, o, t) => {
      tone(c, o, t, 'sine', 190, 68, 0.2, 0.5, 0.002, 0.16);
      tone(c, o, t + 0.005, 'sine', 460, 1350, 0.06, 0.22, 0.002, 0.05);
      burst(c, o, t, 'bandpass', 1300, 520, 0.9, 0.38, 0.42, 0.004);
      burst(c, o, t + 0.03, 'highpass', 4200, 3000, 0.7, 0.28, 0.16, 0.01);
      const w = water(c, o, 1600);
      [[0.16, 640], [0.24, 820], [0.31, 560], [0.4, 980], [0.5, 700], [0.62, 880]].forEach(([d, f]) => bubble(c, w, t + d, f, 0.1));
    },
    bbOut: (c, o, t) => { [67, 63, 60].forEach((n, i) => tone(c, o, t + i * 0.16, 'triangle', NOTE(n), null, 0.24, 0.18, 0.01)); },
  };

  // ---------------------------------------------------------------- the live context and its buses
  function unlock() {
    try {
      if (!ctx) {
        const AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return null;
        ctx = new AC({ latencyHint: 'interactive' });
        master = ctx.createGain(); master.gain.value = 1;
        const comp = ctx.createDynamicsCompressor(); comp.threshold.value = -10; comp.ratio.value = 4; comp.attack.value = 0.003; comp.release.value = 0.15;
        master.connect(comp); comp.connect(ctx.destination); outNode = comp;
        buses = { sfx: ctx.createGain(), music: ctx.createGain(), amb: ctx.createGain() };
        buses.sfx.gain.value = 0.85; buses.music.gain.value = 0.8; buses.amb.gain.value = 0.0001;
        for (const k of ['sfx', 'music']) { mutes[k] = ctx.createGain(); mutes[k].gain.value = mute[k] ? 0 : 1; mutes[k].connect(master); }
        buses.sfx.connect(mutes.sfx); buses.music.connect(mutes.music); buses.amb.connect(mutes.music);
      }
      if (ctx.state === 'suspended') ctx.resume();
    } catch (e) { return null; }
    return ctx;
  }
  const live = () => ctx && ctx.state === 'running';
  function play(name) { if (!live()) return; try { SFX[name](ctx, buses.sfx, ctx.currentTime + 0.005); } catch (e) { /* ignore */ } }

  let spinNode = null;
  // ---------------------------------------------------------------- the songs
  // song: { file, gain, lead } (stages.js). The file's bytes are fetched as soon as asked; they are decoded once there
  // is a context (decoding gives the context's own rate). Where the song starts in the decoded buffer is found by its
  // first sound: `lead` is when that comes, in the time of the render (where song time 0 is at 0.05 s), so whatever
  // padding a decoder puts at the front does not matter.
  const bytes = {}, songs = {};
  function fetchSong(song) {
    if (!bytes[song.file]) bytes[song.file] = fetch(song.file).then((r) => { if (!r.ok) throw new Error(song.file + ' ' + r.status); return r.arrayBuffer(); });
    return bytes[song.file];
  }
  function firstSound(buf) {
    const L = buf.getChannelData(0), R = buf.numberOfChannels > 1 ? buf.getChannelData(1) : L;
    for (let i = 0; i < L.length; i++) if (Math.abs(L[i]) > 0.004 || Math.abs(R[i]) > 0.004) return i / buf.sampleRate;
    return 0;
  }
  function prepare(song) {
    if (songs[song.file]) return songs[song.file];
    const p = (async () => {
      const ab = await fetchSong(song);
      if (!ctx) throw new Error('no sound yet');
      const buf = await ctx.decodeAudioData(ab.slice(0));
      p.ready = { buf, zero: firstSound(buf) - song.lead + 0.05 };
      return p.ready;
    })();
    p.catch(() => { if (songs[song.file] === p) delete songs[song.file]; });  // to try again later
    songs[song.file] = p;
    return p;
  }
  const ready = (song) => !!(songs[song.file] && songs[song.file].ready);
  // a decoded song is big (35 s of stereo ~12 MB): let go of one not wanted soon (its file's bytes are kept, small)
  function release(song) { if (song && songs[song.file] && !(cur && cur.song.file === song.file) && !(loopCur && loopCur.song.file === song.file)) delete songs[song.file]; }
  const audioMB = () => Object.values(songs).reduce((s, p) => s + (p.ready ? p.ready.buf.length * p.ready.buf.numberOfChannels * 4 : 0), 0) / 1e6;
  let cur = null;
  // play `song` so that its time 0 (the first beat of its first bar) sounds at context time t0; when it is already
  // playing, it goes over with a quick crossfade (the orbit stage going back two beats)
  function playSong(song, t0) {
    if (!ctx || !ready(song)) return false;
    const S = songs[song.file].ready, now = ctx.currentTime, fade = cur ? 0.03 : 0;
    let when = t0, off = S.zero;                       // where song time 0 is in the buffer
    // a start already past (the orbit going back mid-song) goes a moment ahead: a source started "now" begins at the
    // sound card's next block, late by up to that block (measured: 2.9 ms here, a phone's blocks are bigger)
    const soon = now + 0.03;
    if (when < soon) { off += soon - when; when = soon; }
    stopSong(0.03, when);                              // the one playing goes out as this comes in
    const src = ctx.createBufferSource(); src.buffer = S.buf;
    const g = ctx.createGain(); src.connect(g); g.connect(buses.music);
    if (off < 0) { when -= off; off = 0; }
    if (fade) { g.gain.setValueAtTime(0.0001, when); g.gain.linearRampToValueAtTime(song.gain, when + fade); } else g.gain.value = song.gain;
    src.start(when, off);
    cur = { src, g, song, when, off, zero: S.zero };
    return true;
  }
  function stopSong(fade = 0.4, at = 0) {
    if (!cur || !ctx) { cur = null; return; }
    const { src, g } = cur, t = Math.max(ctx.currentTime, at);
    g.gain.cancelScheduledValues(t); g.gain.setValueAtTime(Math.max(0.0001, g.gain.value), t); g.gain.linearRampToValueAtTime(0.0001, t + fade);
    try { src.stop(t + fade + 0.02); } catch (e) { /* not started */ }
    cur = null;
  }
  // ---------------------------------------------------------------- a stage's own looping music (the baseball stage's):
  // song: { file, gain, loop: [start, end] s }, on the music bus, in softly; stopLoop fades it out
  let loopCur = null;
  function playLoop(song, fadeIn = 0.8) {
    if (!ctx || !ready(song)) return false;
    stopLoop(0.1);
    const S = songs[song.file].ready, src = ctx.createBufferSource();
    src.buffer = S.buf; src.loop = true; src.loopStart = song.loop[0]; src.loopEnd = song.loop[1];
    const g = ctx.createGain(), t0 = ctx.currentTime + 0.03; src.connect(g); g.connect(buses.music);
    g.gain.setValueAtTime(0.0001, t0); g.gain.linearRampToValueAtTime(song.gain, t0 + fadeIn);
    src.start(t0, song.loop[0]);
    loopCur = { src, g, song };
    return true;
  }
  function stopLoop(fade = 0.6) {
    if (!loopCur || !ctx) { loopCur = null; return; }
    const { src, g } = loopCur, t = ctx.currentTime;
    g.gain.cancelScheduledValues(t); g.gain.setValueAtTime(Math.max(0.0001, g.gain.value), t); g.gain.linearRampToValueAtTime(0.0001, t + fade);
    try { src.stop(t + fade + 0.02); } catch (e) { /* not started */ }
    loopCur = null;
  }
  // ---------------------------------------------------------------- the running music: one source looping the file's
  // loop (bgm: { file, gain, loop: [start, end] s }); it plays on (silent) through the mini-games, and comes back up
  const AMB = 0.55;                                       // its bus's level when on
  let bgm = null, bgmSrc = null, bgmWant = false;
  function setBGM(b) { bgm = b; fetchSong(b).catch(() => {}); if (ctx) prepare(b).catch(() => {}); }
  function startBGM() {
    if (!ctx || !bgm || bgmSrc) return;
    if (!ready(bgm)) { prepare(bgm).then(() => { if (bgmWant) startBGM(); }).catch(() => {}); return; }
    const S = songs[bgm.file].ready, src = ctx.createBufferSource();
    src.buffer = S.buf; src.loop = true; src.loopStart = bgm.loop[0]; src.loopEnd = bgm.loop[1];
    const g = ctx.createGain(), t0 = ctx.currentTime + 0.05; src.connect(g); g.connect(buses.amb);
    g.gain.setValueAtTime(0.0001, t0); g.gain.linearRampToValueAtTime(bgm.gain, t0 + 1.2);   // in softly, whenever it comes
    src.start(t0, bgm.loop[0]);
    bgmSrc = src;
  }
  function ambience(on) {
    bgmWant = on;
    if (!ctx) return;
    const g = buses.amb.gain, t = ctx.currentTime;
    g.cancelScheduledValues(t); g.setValueAtTime(Math.max(0.0001, g.value), t);
    if (on) { startBGM(); g.linearRampToValueAtTime(AMB, t + 1.5); } else g.linearRampToValueAtTime(0.0001, t + 0.6);
  }
  // the spinner: a hum whose pitch follows how fast you turn
  function spin(speed) {
    if (!live()) return;
    if (speed === null) { if (spinNode) { spinNode.g.gain.setTargetAtTime(0.0001, ctx.currentTime, 0.05); spinNode.o.stop(ctx.currentTime + 0.3); spinNode = null; } return; }
    if (!spinNode) {
      const o = ctx.createOscillator(); o.type = 'sawtooth';
      const f = ctx.createBiquadFilter(); f.type = 'bandpass'; f.Q.value = 3; f.frequency.value = 900;
      const g = ctx.createGain(); g.gain.value = 0.0001;
      o.connect(f); f.connect(g); g.connect(buses.sfx); o.start();
      spinNode = { o, f, g };
    }
    const s = Math.min(1, speed / 3);                         // turns per second -> 0..1
    spinNode.o.frequency.setTargetAtTime(160 + 520 * s, ctx.currentTime, 0.04);
    spinNode.f.frequency.setTargetAtTime(600 + 1800 * s, ctx.currentTime, 0.04);
    spinNode.g.gain.setTargetAtTime(0.02 + 0.09 * s, ctx.currentTime, 0.05);
  }
  function setMute(kind, on) {                               // kind: 'sfx' | 'music' (works while paused too)
    mute[kind] = on;
    try { localStorage.setItem('bodyrun.mute.' + kind, on ? '1' : '0'); localStorage.removeItem('bodyrun.mute'); } catch (e) { /* storage off */ }
    const g = mutes[kind]; if (g) { g.gain.cancelScheduledValues(0); g.gain.value = on ? 0 : 1; }
  }

  // ---------------------------------------------------------------- tests: render offline and hand back the samples
  async function renderOffline(what, secs) {                // the effects one after another (tests)
    const sr = 44100;
    const c = new OfflineAudioContext(1, Math.ceil(sr * secs), sr);
    const comp = c.createDynamicsCompressor(); comp.threshold.value = -10; comp.ratio.value = 4; comp.attack.value = 0.003; comp.release.value = 0.15;
    comp.connect(c.destination);
    const bus = c.createGain(); bus.gain.value = 0.85; bus.connect(comp);
    Object.keys(SFX).forEach((n, i) => SFX[n](c, bus, 0.05 + i * 0.6));
    const buf = await c.startRendering();
    return buf.getChannelData(0);
  }

  // ---------------------------------------------------------------- tests: record what goes out (after the master
  // compressor), each block stamped with its frame in the context's own time (an AudioWorklet), so where a sound is in
  // the recording says exactly when the game played it
  let tapNode = null, tapChunks = [];
  async function tapStart() {
    if (!ctx) return false;
    const code = `class Tap extends AudioWorkletProcessor { constructor() { super(); this.b = new Float32Array(8192); this.n = 0; this.f = -1; }
      process(ins) { const i = ins[0]; if (!i || !i[0]) return true; const L = i[0], R = i[1] || i[0];
        if (this.f < 0) this.f = currentFrame;
        for (let k = 0; k < L.length; k++) this.b[this.n++] = (L[k] + R[k]) / 2;
        if (this.n >= 8192 - 128) { this.port.postMessage({ f: this.f, d: this.b.slice(0, this.n) }); this.n = 0; this.f = -1; }
        return true; } }
      registerProcessor('tap', Tap);`;
    await ctx.audioWorklet.addModule(URL.createObjectURL(new Blob([code], { type: 'application/javascript' })));
    tapChunks = [];
    tapNode = new AudioWorkletNode(ctx, 'tap', { numberOfInputs: 1, numberOfOutputs: 1, outputChannelCount: [1] });
    tapNode.port.onmessage = (e) => tapChunks.push(e.data);
    const z = ctx.createGain(); z.gain.value = 0; outNode.connect(tapNode); tapNode.connect(z); z.connect(ctx.destination);
    return true;
  }
  function tapTake() {                                      // the recording so far: { sr, f0, data: Float32Array }
    if (!tapChunks.length) return null;
    const f0 = tapChunks[0].f, end = tapChunks[tapChunks.length - 1].f + tapChunks[tapChunks.length - 1].d.length, out = new Float32Array(end - f0);
    for (const c of tapChunks) out.set(c.d, c.f - f0);
    return { sr: ctx.sampleRate, f0, data: out };
  }

  return {
    tapStart, tapTake,
    unlock, play, fetchSong, prepare, ready, playSong, stopSong, setBGM, ambience, spin, setMute, renderOffline, release, audioMB, playLoop, stopLoop,
    get looping() { return loopCur ? loopCur.song : null; },
    get bgmOn() { return !!bgmSrc; },
    get playing() { return cur ? cur.song : null; },
    songTime: () => (cur && ctx ? ctx.currentTime - cur.when + cur.off - cur.zero : null),   // where the song is now (tests)
    songZero: (song) => (songs[song.file] && songs[song.file].ready ? songs[song.file].ready.zero : null),
    muted: (kind) => mute[kind],
    muteGain: (kind) => (mutes[kind] ? mutes[kind].gain.value : null),     // (tests)
    get ctx() { return ctx; },
    live,
    latency: () => (ctx ? (ctx.outputLatency || 0) + (ctx.baseLatency || 0) : 0),
    names: () => Object.keys(SFX),
  };
})();

    ctx.beginPath(); ctx.moveTo(ex - 2.6, ey - 1.2); ctx.lineTo(ex + 1.6, ey - 2.6); ctx.lineTo(ex + 0.6, ey + 1.8); ctx.closePath();
    ctx.fillStyle = '#c08cff'; ctx.lineWidth = 1; ctx.strokeStyle = '#1a0a14'; ctx.fill(); ctx.stroke();
    ctx.restore();
  }

  // ---------------------------------------------------------------- the test pilot (?auto): looks a little ahead
  function pilot() {
    if (inWater()) { pilotSwim(); return; }
    G.pilotUp = false;
    const px = G.x;
    let jump = false, slide = false;
    for (const o of G.obs) {
      const dx = o.x - (px + 10);                            // distance from the front of the player
      if (dx + o.w < -30 || dx > G.v * 0.9) continue;
      if (o.kind === 'pit') {
        const wide = o.w > G.v * 0.5, c = o.x + o.w / 2 - px;
        if (G.onGround && c < G.v * (wide ? 0.47 : 0.35) && o.x + o.w > px) jump = true;
        if (wide && !G.onGround && G.jumps === 1 && G.vy < 90 && o.x + o.w > px) jump = true;
        continue;
      }
      if (o.kind === 'door') {
        // which lip is shut while we pass it
        const vE = curSpeed(), t0 = (o.x - (px + SLW)) / vE, t1 = (o.x + o.w - (px - SLW)) / vE;
        if (t1 < 0) continue;
        let mb = 0, mt = 0;
        for (let k = 0; k <= 10; k++) { const [b, t] = doorExt(o, G.t + Math.max(0, t0 - 0.04 + (t1 - t0 + 0.08) * k / 10)); mb = Math.max(mb, b); mt = Math.max(mt, t); }
        if (mb > 0.2 && G.onGround && o.x + o.w / 2 - px < G.v * 0.3) jump = true;
        if (mt > 0.2 && dx < G.v * 0.3 && dx + o.w > -28) slide = true;
        continue;
      }
      if (o.kind === 'drop') { if (o.st === 'land' && dx + o.w / 2 < G.v * 0.294 && dx + o.w > 0 && G.onGround) jump = true; continue; }
      if (o.kind === 'spike') { if (o.st !== 'hidden' && dx + o.w / 2 < G.v * 0.294 && dx + o.w > 0 && G.onGround) jump = true; continue; }
      if (o.kind === 'shot') {
        const vc = G.v + (o.moving ? o.fly : 0);
        if (!o.low) { if (dx < vc * 0.3 && dx + o.w > -28) slide = true; }
        else if (dx + o.w / 2 < vc * 0.3 && dx + o.w > 0 && G.onGround) jump = true;
        continue;
      }
      if (o.kind === 'bob') { if (dx + o.w / 2 < G.v * 0.333 && dx + o.w > 0 && G.onGround) jump = true; continue; }
      if (o.kind === 'swim') {
        const vc = G.v + o.vx;
        if (!o.low) { if (dx < vc * 0.3 && dx + o.w > -28) slide = true; }
        else if (dx + o.w / 2 < vc * 0.333 && dx + o.w > 0 && G.onGround) jump = true;
        continue;
      }
      if (o.kind === 'float' || o.kind === 'hang') { if (dx < G.v * 0.28 && dx + o.w > -28) slide = true; }
      else {
        const tLead = o.kind === 'huge' ? PILOT_HUGE : o.kind === 'tall' ? 0.35 : 0.24;
        if (dx < G.v * tLead && dx + o.w > 0 && G.onGround) jump = true;
        if (o.kind === 'tall' && !G.onGround && G.jumps === 1 && (G.vy < 90 || (G.v > 420 && dx < G.v * 0.14 + 20)) && dx < G.v * 0.35 && dx + o.w > -4) jump = true;
        if (o.kind === 'huge' && !G.onGround && G.jumps === 1 && G.vy < 60 && dx + o.w > -4) jump = true;
        if (o.kind === 'tall' && !G.onGround && G.jumps === 2 && G.vy < 0 && dx < G.v * 0.2 && dx + o.w > -4) jump = true;      // a third to save it
        if (o.kind === 'huge' && !G.onGround && G.jumps === 2 && G.vy < 60 && dx + o.w > -4) jump = true;
      }
    }
    if (jump) pressed.jump = true;
    G.slideHeld = slide && !jump;
  }

  // ---------------------------------------------------------------- the baseball stage (in the jejunum)
  // A ballpark of the gut's own tissue, seen from behind home plate. A macrophage on the mound throws five pitches; the
  // runner stands up at the plate on two legs with a bat. Drag on the left to put the bat's ring where the ball will cross

  // in the ring, on time, is a home run (points: each one); in the ring but a little early or late, a foul (off to the
  // left or right); anything else a miss (a swing: 헛스윙, none: 스트라이크). Five pitches, whatever happens (no
  // strike-outs); only the home runs score (no harm either way). The swing button swings any time (a
  // practice swing before the throw, to get the feel; only a swing at the ball in flight counts). The game's own clock
  // (no song here; the run's music goes on).
  const BBF = M.bb || { mound: [210, 100], plate: [210, 172] };                 // the field picture's numbers (baseball.py)
  const BB_N = 5;                                                               // pitches

  // the break at the plate (units; sideways ones go either way), how late it comes (the
  // power of the flight it grows with: 2 early and long, 6 all at the end), and a rise on the way (the curve's arc)
  const BB_TYPES = [                                                        // (T: the flight, 10% slower than v34)
    { name: '직구', T: 0.378, bx: 0, by: 0, pw: 3, rise: 0 },
    { name: '커브', T: 0.533, bx: 14, by: 26, pw: 2, rise: 16 },              // up first, then a long drop
    { name: '포크볼', T: 0.422, bx: 0, by: 34, pw: 7, rise: 0 },             // looks straight, falls off the table at the end
    { name: '슬라이더', T: 0.433, bx: 32, by: 4, pw: 3, rise: 0 },           // late, sideways
    { name: '체인지업', T: 0.544, bx: 3, by: 9, pw: 2, rise: 0 },            // slow, sinking a little
  ];
  const BB_PTS = { hr: 1000 };
  // the hit: the bat meets the ball BB_DS after the tap (the swing down), the game stops a moment there (hit-stop,
  // longer for a home run) while a crack bursts out of the meeting point with rings spreading like a sound wave, and the
  // ball flies off: to the left, the middle or the right at random (a foul: off to the side, left if early, right if late)
  const BB_DS = 0.035, BB_HOLD = { hr: 0.15, foul: 0.08 }, BB_FX = 0.55;
  const BB_SWING = 0.65;                                                        // a whole swing, down, round and back
  const BB_PS = BBF.pscale || 1.45;                                            // the pitcher's picture, scaled (as far off as the mound)
  // the batter: the runner's own pictures from six sides (front 0, front-right 45, right 90, back-right 135, back 180,
  // back-left 225; 270 and 315 are 90 and 45 turned over), standing on its feet left of the plate. It waits turned
  // towards the pitcher (135) and turns with the swing (180 at the hit, 225 after), the bat in two fists of its colour
  const BB_BAT = 60, BB_FIST = 4.4;
  const BAT_COL = { tardigrade: '#f0b870', lacto: '#7cd04a', paramecium: '#3aa8e8', amoeba: '#b060d8', daphnia: '#e8b060',
    pillbug: '#a4a6ba', ladybug: '#3a3438', jelly: '#f4a0d0', sub: '#f4c430', phage: '#c0b4e8' };
  const bbKeys = new Set();
  function startBaseball() {
    holdBoost();
    G.obs = G.obs.filter((o) => o.x + o.w < G.x - 12);
    G.items = G.items.filter((i) => i.x < G.x - 12 || i.taken);
    G.bb = { st: 'intro', stT: G.t, inT: G.t, k: 0, res: [], hr: false, cur: [0, 0], drag: null, p: null, swingT: -9, gain: 0, msg: null, ball: null, pend: null, hold: 0, fx: null };
    G.slideHeld = false; held.clear(); pressed.jump = false; bbKeys.clear();
    bbMusic();
  }
  // the stage's music: the running music fades, the ballpark's comes in (when its file is decoded; tried again each step)
  function bbMusic() {
    const b = G.bb; if (!b || b.music || CAPTURE || !STAGES.bb || !SND.live()) return;
    if (!SND.ready(STAGES.bb)) { SND.prepare(STAGES.bb).catch(() => {}); return; }
    b.music = SND.playLoop(STAGES.bb); SND.ambience(false);
  }
  function endBaseball() {
    if (G.bb && G.bb.music) { SND.stopLoop(0.8); SND.ambience(true); }
    G.bb = null; G.games = (G.games || 0) + 1; resumeBoost();
    G.genX = Math.max(G.genX, G.x + NW * 0.8);
    G.banner = G.t;
  }
  // ---------------------------------------------------------------- the end of the body (stage 1 to 2): the end of the
  // anus is packed full of stool, floor to roof; the runner brakes and goes head first into it, stuck; the whole lot is
  // pushed out (to the right) and straight into the toilet: under its water the runner comes in from the top left with a
  // lump of it (plop), sinks to the bottom, the lumps drift off and stage 2 begins. Times (s) from the moment it stops
  const CUT_FACE = 200;                              // the packed stool's face: this far before the end of the anus
  const CUT_PAD = 44;                                // (its picture starts this far left of the face: the front logs' ends at the floor)
  const CUT_IN = 3;                                  // how far past the face the runner's middle goes in (about half of it in)
  const CUT_CLEAR = 150, CUT_AFTER = 300;           // nothing set out from the braking's start (less this) to this far into stage 2
  const CUT_BRAKE = 560;                             // the braking is at most this long (at a booster's speed, short and hard)
  const CUT_PUSH = [0.3, 0.95], CUT_SWAP = 0.9, CUT_DIVE = [0.95, 1.0], CUT_HIT = 0.08, CUT_END = 2.0;
  // the big chunk that comes into the toilet with the runner, stuck on its back (x, up: in the runner's size; turn)
  const CUT_STUCK = [['cut_chunk', -0.75, 0.5, 0.12]];
  const cutOn = () => G.cut || (G.station >= 0 && COURSE[G.station][5] === STAGE2 - 1);      // in the anus, or in the cut
  const cutFaceX = () => (G.cut ? G.cut.faceX : Math.floor(G.x / LAP) * LAP + S2_X - CUT_FACE);
  function cutCheck() {
    const s = stationAt(G.x), stopLx = S2_X - CUT_FACE + CUT_IN, sp = curSpeed();
    if (stopLx - s.lx <= Math.min(CUT_BRAKE, Math.max(90, sp * 0.55))) startCut(s.lap * LAP + stopLx, sp);
  }
  function startCut(stopX, sp) {
    holdBoost();
    const faceX = stopX - CUT_IN;
    stopX = Math.max(stopX, G.x);
    const v0 = Math.max(sp, 60), d = stopX - G.x;
    G.cut = { t0: G.t, x0: G.x, stopX, faceX, td: d > 0.5 ? 2 * d / v0 : 0, ts: 0, lap: Math.floor(faceX / LAP), swap: 0, splash: 0, landed: 0 };
    G.obs = G.obs.filter((o) => o.x + o.w < G.x - 12);
    G.items = G.items.filter((i) => i.x < G.x - 12 || i.taken);
    G.slideHeld = false; held.clear(); pressed.jump = false;
  }
  function stepCut() {
    const c = G.cut;
    pressed.jump = false; G.slideHeld = false;
    if (!c.ts) {                                              // braking, evenly, to a stop in the stool
      const k = c.td > 0 ? Math.min(1, (G.t - c.t0) / c.td) : 1;
      G.x = c.x0 + (c.stopX - c.x0) * (1 - (1 - k) * (1 - k));
      if (k >= 1) c.ts = G.t;

    }
    const u = G.t - c.ts;
    if (!c.swap && u >= CUT_SWAP) {                           // out of the screen: on to the start of stage 2
      c.swap = G.t;

      G.obs = []; G.items = []; G.genX = G.x + NW * 0.8;
    }
    if (c.swap && !c.banner) { c.banner = true; G.banner = G.t; }
    if (!c.splash && u >= CUT_DIVE[0] + CUT_HIT) {           // through the water's surface
      c.splash = G.t; SND.play('splash');
      const R = rng(Math.floor(G.t * 1000) + 7);
      c.bub = Array.from({ length: 26 }, (_, i) => ({ k: 0.06 + 0.5 * (i / 26) ** 1.3, dx: (R() * 2 - 1) * 7, dy: (R() * 2 - 1) * 6, r: 0.8 + R() * 1.8, w: R() * 6 }));
      c.drops = Array.from({ length: 12 }, () => ({ vx: (R() * 2 - 1) * 70, vy: -60 - R() * 70, r: 0.9 + R() * 1.2 }));
    }
    if (!c.landed && u >= CUT_DIVE[0] + CUT_DIVE[1]) c.landed = G.t;
    if (u >= CUT_END) cutDone();
  }
  function cutDone() {                                        // stage 2 goes on (the lumps drift off a moment longer)
    const c = G.cut; if (!c) return;
    if (!c.swap) { G.x = c.lap * LAP + S2_X + 1; G.obs = []; G.items = []; G.genX = G.x + NW * 0.8; }
    G.cut = null; G.cutTail = { landed: c.landed || G.t, splash: c.splash, bub: c.bub || [], drops: c.drops || [] };
    if (G.theme !== COURSE[S2_I][3]) G.station = -1;
    G.slow = 0; resumeBoost();
    G.genX = Math.max(G.genX, G.x + NW * 0.8);
  }
  function sprRot(name, cx, cy, rot, alpha = 1, k = 1) {
    const w = SW(name) * k, h = SH(name) * k;
    ctx.save(); ctx.translate(cx, cy); ctx.rotate(rot); spr(name, -w / 2, -h / 2, alpha, w, h); ctx.restore();
  }
  const cutReady = () => M.sprites.cut_wall && bmp[M.sprites.cut_wall.f];
  const cutPush = (u) => { const k = Math.max(0, Math.min(1, (u - CUT_PUSH[0]) / (CUT_PUSH[1] - CUT_PUSH[0]))); return k * k * (NWf + 400); };
  const cutDX = () => (G.cut && G.cut.ts && !G.cut.swap ? cutPush(G.t - G.cut.ts) : 0);
  // stuck: a little shake as it goes in
  const cutShake = () => { if (!G.cut || !G.cut.ts || G.cut.swap) return 0; const u = G.t - G.cut.ts; return u < 0.25 ? 0.7 * Math.sin(u * 110) * (1 - u / 0.25) : 0; };
  // the packed stool (world: drawn after the runner, so that going in, its front half is in it), pushed along with it
  function drawCutBack(cam) {
    if (!cutOn() || (G.cut && G.cut.swap) || !cutReady()) return;
    const x = cutFaceX() - CUT_PAD - cam + cutDX();
    if (x > NWf || x + SW('cut_wall') < 0) return;
    spr('cut_wall', x, GY + 2 - SH('cut_wall'));
  }
  // the runner with its lumps on, in one piece (into the toilet)
  function drawMass(cx, fy, rot) {
    const n = 'ch_' + G.char, w = SW(n), h = SH(n), my = fy - h * 0.55;
    ctx.save(); ctx.translate(cx, my); ctx.rotate(rot); ctx.translate(-cx, -my);
    spr(n, cx - w / 2, fy - h);
    for (const [ln, dx, up, r] of CUT_STUCK) sprRot(ln, cx + dx * w, fy - up * h, r);
    ctx.restore();
  }
  // into the toilet: from the top left, through the surface, down to the bottom (feet at fy)
  function cutDiveAt(k) {
    const e = 1 - (1 - k) * (1 - k);
    return [PX - 62 + 62 * e, -12 + (GY + 1 + 12) * e, 0.75 * (1 - k) * (1 - k)];
  }
  function drawDive() {
    const c = G.cut, k = Math.max(0, Math.min(1, (G.t - c.ts - CUT_DIVE[0]) / CUT_DIVE[1]));
    if (G.t - c.ts < CUT_DIVE[0]) return;

  }
  // over the scene: the splash at the surface, the bubbles of the way down, then the stage's title
  function drawCut() {
    const c = G.cut, tail = G.cutTail;
    world();
    const sp = c ? c.splash : tail ? tail.splash : 0, bub = c ? c.bub : tail ? tail.bub : null, drops = c ? c.drops : tail ? tail.drops : null;
    if (sp && bub) {
      const v = G.t - sp, [sx] = cutDiveAt(CUT_HIT / CUT_DIVE[1]), sy = CEIL;
      for (const d of drops) {                           // thrown up above the water, falling back
        const x = sx + d.vx * v, y = sy - 1 + d.vy * v + 230 * v * v;
        if (y > sy || v > 0.8) continue;
        ctx.beginPath(); ctx.arc(x, y, d.r + 0.4, 0, 6.29); ctx.fillStyle = '#2a5a62'; ctx.fill();
        ctx.beginPath(); ctx.arc(x, y, d.r, 0, 6.29); ctx.fillStyle = '#d6f6f8'; ctx.fill();
      }

        const k = v / 0.6;                               // and the hollow it leaves behind going down, closing

        for (let r = 0; r < 2; r++) {

      if (ta > 0) label('스테이지 2', NWf / 2, 70, 20, 'center', ta, '#ffffff');
      if (tail && v > 2.2) G.cutTail = null;

  }
  // under the water at the start of stage 2 (world: after the runner): the lumps drift up and away off it
  function drawCutDrift() {

    const v = G.t - t0, n = 'ch_' + G.char, w = SW(n), h = SH(n), D = 1.1;

  }
  const bbZone = () => [NWf / 2, BB_ZY];
  function bbPitch() {                                                         // the next pitch: its kind, where it crosses
    const b = G.bb, ty = BB_TYPES[Math.floor(Math.random() * BB_TYPES.length)];
    const side = Math.random() < 0.5 ? -1 : 1;
    const tx = (Math.random() * 2 - 1) * BB_ZW * 0.38, tyy = (Math.random() * 2 - 1) * BB_ZH * 0.36;

  }
  function bbPitcherFrame() {                                                  // set, wind-up, release, follow-through
    const b = G.bb, p = b.p, u = G.t - b.stT;
    if (b.st === 'wind') return u < 0.3 ? 0 : u < 0.8 ? 1 : 2;
    if (b.st === 'fly') return G.t - p.rel < 0.12 ? 2 : 3;

  }
  function bbPitcherAt() { const [zx] = bbZone(); return [zx + (BBF.mound[0] - 210), BBF.mound[1] - 1]; }
  function bbHand(f) {
    const s = M.sprites['bb_p' + f], [mx, my] = bbPitcherAt();
    if (!s || !s.hand) return [mx, my - 30];

  }
  // the ball in flight: s from 0 at the release to 1 at the plate (and on past it, into the catcher's mitt)
  function bbBallAt(t) {
    const p = G.bb.p, s = Math.max(0, (t - p.rel) / p.type.T);
    const [rx, ry] = bbHand(2), [zx, zy] = bbZone(), P = [zx + p.tx, zy + p.ty];
    const e = s * s * 0.35 + s * 0.65;                                         // a little faster as it comes

    const pw = p.type.pw, f = s <= 1 ? Math.pow(s, pw) : 1 + pw * (s - 1);     // (past the plate: on in a line)

    const p = stationAt(G.x), stg = stageOf(p.lx), [s0, s1] = stageSpan(stg), px0 = NW / 2 - BAR_W / 2, px1 = px0 + BAR_W, py = 31;
    rrect(px0 - 1, py - 1, px1 - px0 + 2, 4.4, 2.2); ctx.fillStyle = '#1a0a14'; ctx.fill();
    ctx.fillStyle = '#4a3848'; ctx.fillRect(px0, py, px1 - px0, 2.4);
    const mk = px0 + (px1 - px0) * (p.lx - s0) / (s1 - s0);
    ctx.fillStyle = '#ff6a8a'; ctx.fillRect(px0, py, mk - px0, 2.4);
    for (const m of MINI_MARKS) if (stageOf(m.lx) === stg) miniMark(m.kind, px0 + (px1 - px0) * (m.lx - s0) / (s1 - s0), py + 1.2, p.lx > m.lx + 1 || !!G[m.kind] ? 0.45 : 1);
    label(String(stg), px0 - 6, py + 1.4, 7, 'center', 1, '#ffe0a8');
    ctx.beginPath(); ctx.arc(mk, py + 1.2, 2.8, 0, 6.29); ctx.fillStyle = '#1a0a14'; ctx.fill();
    ctx.beginPath(); ctx.arc(mk, py + 1.2, 1.9, 0, 6.29); ctx.fillStyle = '#ffffff'; ctx.fill();
    // the settings (a gear), under the pause button
    {
      rrect(NW - 20, 26.5, 14, 14, 3); ctx.fillStyle = '#1a0a14'; ctx.fill();
      rrect(NW - 19, 27.5, 12, 12, 2.3); ctx.fillStyle = '#f4e8ee'; ctx.fill();
      const gx = NW - 13, gy = 33.5;
      ctx.fillStyle = '#1a0a14'; ctx.beginPath();
      for (let k = 0; k < 8; k++) { const a = k * Math.PI / 4, c = Math.cos(a), sn = Math.sin(a);
        const P = [[-1.15, -4.7], [1.15, -4.7], [1.15, -2.6], [-1.15, -2.6]].map(([x, y]) => [gx + x * c - y * sn, gy + x * sn + y * c]);
        ctx.moveTo(P[0][0], P[0][1]); for (const q of P.slice(1)) ctx.lineTo(q[0], q[1]); ctx.closePath(); }
      ctx.fill();
      ctx.beginPath(); ctx.arc(gx, gy, 3.5, 0, 6.29); ctx.fill();
      ctx.beginPath(); ctx.arc(gx, gy, 1.35, 0, 6.29); ctx.fillStyle = '#f4e8ee'; ctx.fill();
    }

    if (DEBUG_SKIP) {
      rrect(NW - 20, 48.5, 14, 14, 3); ctx.fillStyle = '#1a0a14'; ctx.fill();
      rrect(NW - 19, 49.5, 12, 12, 2.3); ctx.fillStyle = '#f4e8ee'; ctx.fill();
      ctx.fillStyle = '#1a0a14';
      for (const ox of [0, 3.6]) { ctx.beginPath(); ctx.moveTo(NW - 17.2 + ox, 52.3); ctx.lineTo(NW - 13.4 + ox, 55.5); ctx.lineTo(NW - 17.2 + ox, 58.7); ctx.closePath(); ctx.fill(); }
      ctx.fillRect(NW - 9.6, 52.3, 1.4, 6.4);

    button(SET.swap ? bl : br, by, '슬라이드', G.slideHeld);
  }
  // eyelids closing over the screen: 0 open .. 1 shut (close fast, hold, open a little slower)
  const BLINK = 0.32;
  function lidAmount() {
    if (G.blinkAt < 0) return 0;
    const u = G.t - G.blinkAt;
    if (u < 0 || u > BLINK) return 0;
    if (u < 0.08) { const k = u / 0.08; return k * k * (3 - 2 * k); }
    if (u < 0.14) return 1;
    const k = (u - 0.14) / (BLINK - 0.14); return 1 - k * k * (3 - 2 * k);
  }
  function drawLids() {
    const b = lidAmount(); if (b <= 0) return;
    world();
    const c = NWf / 2, bend = 0.32 * (1 - b), N = 32;
    for (const upper of [true, false]) {
      const reach = b * (upper ? NH * 0.6 + 2 : NH * 0.4 + 2);
      const edge = (x) => { const q = (x - c) / c; const d = reach * (1 - bend * q * q); return upper ? d : NH - d; };
      const far = upper ? -2 : NH + 2;
      ctx.beginPath(); ctx.moveTo(-2, far); ctx.lineTo(NWf + 2, far);
      for (let i = N; i >= 0; i--) { const x = (NWf + 4) * i / N - 2; ctx.lineTo(x, edge(x)); }
      ctx.closePath();
      const g = ctx.createLinearGradient(0, far, 0, upper ? reach : NH - reach);
      g.addColorStop(0, '#000000'); g.addColorStop(0.8, '#060203'); g.addColorStop(1, '#1c070a');
      ctx.fillStyle = g; ctx.fill();
    }
  }
  function render() {
    device();
    ctx.fillStyle = '#000'; ctx.fillRect(0, 0, GW, GH);
    if (PROF) {
      for (const [k, f] of [['scene', drawScene], ['lids', drawLids], ['rhythm', drawRhythm], ['orbit', drawOrbit], ['baseball', drawBaseball], ['cut', drawCut], ['hud', drawHud]]) {
        const t0 = performance.now(); f(); PROF[k] = (PROF[k] || 0) + performance.now() - t0;
      }
      PROF.n = (PROF.n || 0) + 1;
    } else {
      drawScene();
      drawLids();
      drawRhythm();
      drawOrbit();
      drawBaseball();
      if (G.cut || G.cutTail) drawCut();
      drawHud();
    }
    // the place's name grows in for a moment when you arrive
    const u = (G.t - G.banner);
    document.getElementById('place').classList.toggle('big', u < 1.6);
  }

  // ---------------------------------------------------------------- labels, overlays
  function setLabel(st, lap) {
    document.getElementById('pname').textContent = st[1];
    document.getElementById('pen').textContent = st[2] + (lap > 0 ? `  ·  ${lap + 1}바퀴` : '');
  }
  function show(id, on) { document.getElementById(id).hidden = !on; }
  function pause(box = 'pauseBox') { if (G.mode !== 'play') return; G.mode = 'pause'; held.clear(); G.slideHeld = false; if (G.rh) G.rh.ptr.clear(); if (G.bb) G.bb.drag = null; bbKeys.clear(); if (box === 'setBox') setLabels(); show(box, true); if (SND.ctx) SND.ctx.suspend(); }
  const openSettings = () => pause('setBox');               // the settings, from the gear on the play screen: the game waits
  function resume() { show('pauseBox', false); show('setBox', false); G.mode = 'play'; last = performance.now(); SND.unlock(); SND.play('ui'); }

  }
  function startGame(c) {

      const b = document.createElement('button'); b.className = 'card' + (c === saved ? ' last' : '');
      const cc = document.createElement('canvas'); cc.width = s.r[2]; cc.height = s.r[3];

  document.getElementById('bResume').onclick = resume;
  document.getElementById('bRestart').onclick = () => startGame(G.char);
  document.getElementById('bChar').onclick = () => { G.mode = 'select'; G.rh = null; G.orb = null; G.bb = null; G.cut = null; G.cutTail = null; SND.unlock(); SND.stopSong(0.2); SND.stopLoop(0.2); SND.spin(null); SND.ambience(false); show('pauseBox', false); show('overBox', false); show('hudText', false); show('select', true); };

  document.getElementById('bSwap').onclick = () => { SET.swap = !SET.swap; try { localStorage.setItem('bodyrun.swap', SET.swap ? '1' : '0'); } catch (e) { /* storage off */ } setLabels(); render(); };

  document.getElementById('bMus').onclick = () => { SND.setMute('music', !SND.muted('music')); setLabels(); };
  document.getElementById('bAgain').onclick = () => startGame(G.char);
  document.getElementById('bChar2').onclick = () => { G.mode = 'select'; SND.ambience(false); show('overBox', false); show('hudText', false); show('select', true); };

  // ---------------------------------------------------------------- loop
  let last = 0, acc = 0;
  const DT = 1 / 120;
  function frame(now) {
    requestAnimationFrame(frame);
    const el = Math.min(0.1, (now - last) / 1000); last = now;
    if (G.mode === 'play') { acc += el; while (acc >= DT) { step(DT); acc -= DT; } }
    if (G.mode === 'play' || G.mode === 'pause' || G.mode === 'over') render();
  }

  // ---------------------------------------------------------------- start
  (async () => {
    resize();
    const at = qs.has('at') ? COURSE.findIndex((s) => s[0] === qs.get('at')) : -1;
    try {
      const first = [decode('common.webp')];
      for (let k = -1; k <= 2; k++) for (const f of themeFiles(COURSE[mod(Math.max(at, 0) + k, COURSE.length)][3])) first.push(decode(f));
      if (PRELOAD) for (const t of Object.keys(M.themes)) for (const f of themeFiles(t)) first.push(decode(f));

    } catch (e) {

    }
    buildSelect();
    if (!CAPTURE) SND.setBGM(STAGES.bgm);                    // the running music's file
    getReady();                                              // the songs' files, while you pick
    document.getElementById('loading').hidden = true;
    const auto = qs.get('char');
    if (CAPTURE || AUTO || auto) startGame(auto && M.chars.includes(auto) ? auto : 'tardigrade');
    else { G.mode = 'select'; show('select', true); }
    if (at >= 0) { G.x = STARTS[at] + 10; G.genX = G.x + 300; G.station = -1; step(0); }
    if (!CAPTURE) requestAnimationFrame((t) => { last = t; frame(t); });
    // test hooks
    window.__ready = true;
    window.__run = (sec) => { const n = Math.round(sec / DT); for (let i = 0; i < n; i++) step(DT); render(); return window.__state(); };
    window.__settle = async () => { while (Object.keys(pending).length) await Promise.all(Object.values(pending)).catch(() => {}); render(); return Object.keys(bmp).length; };
    window.__state = () => ({ mode: G.mode, t: +G.t.toFixed(2), x: Math.round(G.x), v: +G.v.toFixed(1), hp: +G.hp.toFixed(1), score: G.score, eaten: G.eaten, hits: G.hits,
      station: COURSE[Math.max(0, G.station)][0], seg: G.station, theme: G.theme, lid: +lidAmount().toFixed(2), lastHit: G.lastHit, rot, lap: stationAt(G.x).lap, y: +G.y.toFixed(1), slide: G.slide, obs: G.obs.length, items: G.items.length,
      NW, RS: +RS.toFixed(3), GW, GH, rhSong: G.rh ? G.rh.song.id : null, orbSong: G.orb ? OB.song.id : null, rotation: { ...ROT }, o2n: G.o2n, boost: +G.boost.toFixed(2), boostHeld: +G.boostHeld.toFixed(2), boosts: G.boosts, decoded: Object.keys(bmp).length, atp: G.atp || 0, orbits: G.orbits || 0, orb: G.orb ? G.orb.st : null, bb: G.bb ? G.bb.st : null, games: G.games || 0, huge: G.obs.filter((o) => o.kind === 'huge').length });
    window.__G = G;
    window.__mem = () => { let px = 0; const files = {}; for (const [f, b] of Object.entries(bmp)) { const n = b.width * b.height; px += n; files[f] = +(n * 4 / 1e6).toFixed(1); } return { MB: +(px * 4 / 1e6).toFixed(1), files }; };

    window.__orb = () => { const o = G.orb; if (!o) return null; const t = otime();
      return { t: +t.toFixed(3), clock: o.a0 !== null ? 'sound' : 'game', k: o.k, N: OB.N, st: o.st, res: o.res, th: o.st === 'play' ? +(((obAngle(o.k, t, o.next) % 6.2832) + 6.2832) % 6.2832).toFixed(3) : null, off: +o.off.toFixed(3), next: +o.next.toFixed(3), cam: o.cam.map((v) => +v.toFixed(1)) }; };
    window.__orbPlan = (id) => { const pl = id ? orbPlan(STAGES.orb.find((s) => s.id === id)) : OB; return { id: pl.song.id, B: pl.B, ok: pl.ok, N: pl.N, P: pl.P, T: pl.T, hits: pl.hits, swirl: pl.swirl.map((v, i) => v ? i : -1).filter((i) => i >= 0), dir: pl.dir }; };
    window.__stages = STAGES;
    window.__marks = MINI_MARKS; window.__lap = LAP;
    window.__cut = () => (G.cut ? { u: G.cut.ts ? +(G.t - G.cut.ts).toFixed(3) : null, stopped: !!G.cut.ts, swap: !!G.cut.swap, splash: !!G.cut.splash, x: Math.round(G.x) } : null);
    window.__S2 = { STAGE2, S2_X, S2_I, LAP };
    window.__goTo = (kind) => goToPlace(MINI_MARKS.find((m) => m.kind === kind).i);   // (as tapping its mark on the bar)
    window.__orbTap = orbTap;
    window.__boost = startBoost;
    window.__bb = () => { const b = G.bb; if (!b) return null;
      return { st: b.st, k: b.k, res: b.res.slice(), hr: b.hr, gain: b.gain, cur: b.cur.slice(), p: b.p && { type: b.p.type.name, tx: +b.p.tx.toFixed(1), ty: +b.p.ty.toFixed(1), rel: +(b.p.rel - G.t).toFixed(3), arr: +(b.p.arr - G.t).toFixed(3), dt: b.p.dt, d: b.p.d, res: b.p.res } }; };
    window.__bbSwing = () => bbSwing();
    window.__bbTypes = BB_TYPES; window.__bbBallAt = (t) => bbBallAt(t);
    window.__bbAim = (x, y) => { if (G.bb) G.bb.cur = [x, y]; };
    window.__rh = () => { const r = G.rh; if (!r) return null; const t = rtime();
      return { t: +t.toFixed(3), n: r.n, combo: r.combo, maxCombo: r.maxCombo, done: r.done, gain: r.gain,
        notes: r.notes.map((n) => { const o = { b: n.b, kind: n.kind, tn: n.tn, te: n.te, res: n.res, num: n.num };
          if (n.kind === 'p' || n.kind === 'r') { o.x = NWf / 2; o.y = 98; if (n.kind === 'p') o.turns = +n.turns.toFixed(2); else { o.hits = n.hits; o.need = n.need; } } else { const [x, y] = rhPos(n.u, n.v); o.x = x; o.y = y; if (n.dual) o.dual = true; }
          if (n.kind === 's') { const p = rhPath(n); o.path = p.P.filter((_, i) => i % 3 === 0 || i === p.P.length - 1); o.len = p.len; o.inT = n.inT; o.allT = n.allT; o.start = n.start; if (t >= n.tn && t <= n.te) o.ball = rhBall(p, (t - n.tn) / (n.te - n.tn)); }
          return o; }) }; };
    window.__toClient = (x, y) => { const r = cv.getBoundingClientRect(); const X = x * RS, Y = y * RS; const cx = rot ? GH - Y : X, cy = rot ? X : Y;
      return [r.left + cx * r.width / cv.width, r.top + cy * r.height / cv.height]; };
    window.__starts = STARTS;
    window.__hz = { addPit, addDoor, addDrop, addSpike, addShot, hzFam, doorExt, obsBoxes };
    window.__place = (x) => { G.x = x; G.obs = []; G.items = []; G.genX = x + 1e7; G.station = -1; G.mode = 'play'; step(0); G.fade = 1; G.prevTheme = null; render(); return window.__state(); };
  })();
})();
